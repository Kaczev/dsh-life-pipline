<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回忆 · 配置预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f8;color:#252a2b;font:15px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:32px 24px}header,section{border-bottom:1px solid #ccd2d1;padding:16px 0}h1,h2,p{margin:0 0 8px}h1{font-size:24px}h2{font-size:17px}small,footer{color:#56615f}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:4px}input,select{font:inherit;min-height:40px;border:1px solid #939e9b;border-radius:4px;background:white;padding:4px 8px;max-width:100%}:focus-visible{outline:2px solid #176451}output{grid-column:1/-1;color:#26594e}footer{padding-top:16px;font-size:13px}@media(max-width:500px){form{grid-template-columns:1fr}main{padding:16px}}</style><main><header><small>记忆管线 / 记忆类型</small><h1>回忆</h1><p>按情景保存经历。对话只载入当前情景的回忆。</p></header><section><h2>容量限制</h2><form id="limits"><label>最多情景数<input type="number" min="1" value="12" required></label><label>每个情景最多回忆数<input type="number" min="1" value="8" required></label><label>情景简介最多字符数<input type="number" min="1" value="64" required></label><label>单条回忆最多字符数<input type="number" min="1" value="160" required></label><output aria-live="polite"></output></form></section><section><h2>情景与回忆</h2><label>浏览情景<select id="scene"><option value="0">memory-design</option><option value="1">reading-notes</option></select></label><p id="desc"></p><ol id="entries"></ol></section><footer>设计预览 · 示例数据，不写入插件。浏览情景不会切换对话中的情景。</footer></main><script>const f=document.querySelector('form'),s=document.querySelector('select'),data=[['记忆管线的命名与设计决定',['第三种记忆类型定名为「回忆」。']],['读书时想起的片段与讨论',[]]];function cost(){const [a,b,c,d]=Array.from(f.querySelectorAll('input'),e=>e.valueAsNumber);document.querySelector('output').textContent=f.checkValidity()?`目录简介最多 ${a*c} 字符；当前情景正文最多 ${b*d} 字符。`:'上限须为正整数。'}function show(){const [d,items]=data[s.value];document.querySelector('#desc').textContent=d;const list=document.querySelector('ol');list.replaceChildren(...items.map(t=>{let li=document.createElement('li');li.textContent=t;return li}));if(!items.length)list.textContent='暂无回忆。'}f.oninput=cost;s.onchange=show;cost();show()</script></html>

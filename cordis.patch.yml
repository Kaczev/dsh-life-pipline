# dsh-life components. Row IDs are stable: a saved profile override matches by name,
# so renaming an ID silently loads the old module. One row per component package, and
# the row name must stay a bare package name: the host reads that package's own locale
# and icon for the row, and a subpath name would drop the client half.
- insert:
    - id: dsh-lpipe-chat
      name: dsh-lpipe-chat
